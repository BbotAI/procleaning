<!-- blog-sync: image=w800 -->
<!-- Width only, NO -c crop. The card CSS already crops (object-fit:cover over
     a fixed height), so asking Blogger to crop as well crops twice. Blogger's
     centre-crop of a 1200x630 hero shears both sides, which decapitates the
     text on a title-card style image. w800 keeps the full frame and covers a
     ~300-360px card at 2x. -->
        <!-- BLOG-{{SLOT}} -->
        <article class="service-card">
          <div class="service-media"><img src="{{IMAGE}}" alt="{{ALT}}" loading="lazy" width="640" height="420"></div>
          <p style="color:var(--muted);font-size:0.85rem;margin:0 0 6px">{{DATE}}</p>
          <h3>{{TITLE}}</h3>
          <p>{{EXCERPT}}</p>
          <a class="btn btn-outline" href="{{URL}}" target="_blank" rel="noopener">Read More &rarr;</a>
        </article>
